<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>LiftLog</title>
<style>
:root{--bg:#0f1216;--card:#1a1f26;--card2:#232a33;--line:#2c343f;--tx:#e8edf2;--mu:#8b97a6;--ac:#3b8cff;--ok:#2fbf71;--warn:#ff6b6b;--gold:#ffc542;--iso:#a77bff;--car:#ff7a59}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
header.top h1,header.top h2{margin:0 4px;font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:8px 16px 24px;max-width:640px;margin:0 auto}
h2.ex{margin:8px 0 0;font-size:22px}
button{font:inherit;cursor:pointer}
.ic{background:none;border:0;color:var(--tx);font-size:22px;min-width:44px;height:44px;border-radius:10px}
.ic:active{background:var(--card2)}
.btn{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06210f}
.btn.danger{color:var(--warn)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.wide{width:100%;display:block;margin:10px 0}
.btns{display:flex;gap:8px;margin:10px 0}.btns .btn{flex:1}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:14px;margin:8px 0;cursor:pointer}
.row:active{background:var(--card2)}
.row>div{flex:1;min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.go{color:var(--ac);font-weight:600;white-space:nowrap}
.muted{color:var(--mu);font-size:14px}
.card{background:var(--card);border-radius:12px;padding:14px;margin:10px 0}
.card.hi{border:1px solid var(--ac);display:flex;align-items:center;gap:12px}.card.hi>div{flex:1}
.sec{margin:22px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:600;display:flex;align-items:center;gap:8px}
.sec .sp{flex:1}
.sec button{background:none;border:0;color:var(--ac);font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;padding:6px 0}
.empty{color:var(--mu);text-align:center;padding:28px 12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.tag.iso{background:#a77bff26;color:var(--iso)}.tag.cardio{background:#ff7a5926;color:var(--car)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
label.f{display:block;margin:12px 0}label.f>span{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.sets{margin:12px 0}
.sets .sh,.sets .sr{display:grid;grid-template-columns:26px minmax(0,1fr) 70px 54px 46px 44px;gap:6px;align-items:center}
.sets.iso .sh,.sets.iso .sr{grid-template-columns:26px minmax(0,1fr) 58px 58px 52px 44px}
.sets.cardio .sh,.sets.cardio .sr{grid-template-columns:26px repeat(4,minmax(0,1fr)) 44px}
.sets .sh{font-size:12px;color:var(--mu);text-transform:uppercase;padding:0 4px 4px}
.sets .sh span{text-align:center}.sets .sh span:nth-child(2){text-align:left}
.sets.cardio .sh span:nth-child(2){text-align:center}
.sets .sr{background:var(--card);border-radius:10px;padding:6px 4px;margin:6px 0}
.sets .sr>span:first-child{text-align:center;font-weight:700;color:var(--mu)}
.sets .sr input{padding:8px 2px;text-align:center;font-size:17px;font-weight:600}
.sets .prev{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets .orm{text-align:center;font-size:14px;color:var(--mu)}
.sets .sr.done{background:#16301f}.sets .sr.done .orm{color:var(--tx);font-weight:700}
.sets .sr.done input{background:transparent;border-color:transparent}
.chk{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mu);font-size:18px;font-weight:700}
.sr.done .chk{background:var(--ok);border-color:var(--ok);color:#06210f}
.play{height:40px;border-radius:10px;border:0;background:var(--iso);color:#fff;font-size:16px;font-weight:700}
.sr.done .play{background:transparent;color:var(--tx);font-size:14px}
.holdp{background:var(--iso);color:#fff;border-radius:16px;padding:14px;margin:12px 0;text-align:center}
.holdp.ready{background:var(--card2);color:var(--tx)}
.holdp #hlab{font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.08em}
.holdp #hnum{font-size:76px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.holdp .bar{height:8px;background:#0003;border-radius:4px;overflow:hidden;margin:8px 0 12px}
.holdp .bar i{display:block;height:100%;background:#fff;width:0}
.holdp .btn{background:#0003;border-color:transparent;color:inherit;width:100%}
.pr{color:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0;border-radius:8px;font-weight:600;font-size:14px}
.seg button.on{background:var(--card2);color:var(--tx)}
.chart{background:var(--card);border-radius:12px;padding:8px 6px 4px;margin:6px 0}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--mu);font-size:11px}
.chart .ln{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-linejoin:round}
.chart .dot{fill:var(--ac)}.chart .best{fill:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.stats div{background:var(--card);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--mu)}
.pick.on{outline:2px solid var(--ac)}
.pick .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.pick.on .ck{background:var(--ac);border-color:var(--ac);color:#fff}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:18px}
.stepper b{min-width:20px;text-align:center}
.small-ic{background:none;border:0;color:var(--mu);font-size:18px;width:34px;height:34px}
.calbox{display:flex;gap:8px;align-items:center}.calbox input{font-size:22px;font-weight:700;text-align:center}
nav#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#151a20;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:12}
nav#nav>button{flex:1;background:none;border:0;color:var(--mu);padding:9px 0 10px;font-size:12px;font-weight:600;min-height:60px}
nav#nav>button.on{color:var(--ac)}
nav#nav svg{display:block;margin:0 auto 3px;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav#nav .car{font-size:10px;margin-left:2px}
#scrim{position:fixed;inset:0;background:#0007;z-index:11}
#menu{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom));z-index:13;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:6px;min-width:220px;box-shadow:0 10px 30px #000a}
#menu button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;color:var(--tx);font-size:17px;font-weight:600;padding:0 14px;min-height:58px;border-radius:12px;text-align:left}
#menu button.on{background:var(--card);color:var(--ac)}
#menu button:active{background:var(--card)}
#menu svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#rest{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:10;background:var(--ac);color:#fff;border-radius:14px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px #0008}
#rest b{font-size:22px;flex:1;font-variant-numeric:tabular-nums}
#rest button{background:#ffffff26;border:0;color:#fff;border-radius:8px;padding:8px 10px;font-weight:600}
#rest.over{background:var(--ok);color:#06210f}
#rest.hold{background:var(--iso)}
#toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:20;font-weight:600;box-shadow:0 6px 20px #0008;max-width:90vw}
#toast.gold{background:var(--gold);color:#2b1d00;border-color:var(--gold)}
.hist-set{display:inline-block;margin-right:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest" hidden></div>
<div id="toast" hidden></div>
<div id="scrim" hidden onclick="closeMenu()"></div>
<div id="menu" hidden></div>
<nav id="nav"></nav>
<input type="file" id="file" hidden>
<script>
'use strict';
/* ---------- storage (IndexedDB, all on this phone) ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('liftlog', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function loadState() {
  const db = await dbp;
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get('state');
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
let saveTimer;
function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
async function saveNow() {
  clearTimeout(saveTimer);
  const db = await dbp;
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(S, 'state');
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

/* ---------- seed exercises ---------- */
const SEED = {
  lift: {
    Chest: 'Barbell Bench Press|Incline Barbell Bench Press|Decline Barbell Bench Press|Dumbbell Bench Press|Incline Dumbbell Press|Dumbbell Fly|Cable Crossover|Chest Dip|Push-Up|Machine Chest Press|Pec Deck',
    Back: 'Deadlift|Pull-Up|Chin-Up|Lat Pulldown|Barbell Row|Dumbbell Row|Seated Cable Row|T-Bar Row|Machine Row|Straight-Arm Pulldown|Back Extension|Rack Pull',
    Shoulders: 'Overhead Press|Seated Dumbbell Press|Arnold Press|Lateral Raise|Front Raise|Rear Delt Fly|Face Pull|Upright Row|Machine Shoulder Press|Barbell Shrug|Dumbbell Shrug',
    Biceps: 'Barbell Curl|EZ-Bar Curl|Dumbbell Curl|Hammer Curl|Preacher Curl|Incline Dumbbell Curl|Cable Curl|Concentration Curl',
    Triceps: 'Close-Grip Bench Press|Skull Crusher|Tricep Pushdown|Rope Pushdown|Overhead Tricep Extension|Tricep Dip|Tricep Kickback',
    Legs: 'Barbell Squat|Front Squat|Leg Press|Hack Squat|Romanian Deadlift|Lunge|Bulgarian Split Squat|Leg Extension|Lying Leg Curl|Seated Leg Curl|Hip Thrust|Standing Calf Raise|Seated Calf Raise|Goblet Squat',
    Abs: 'Crunch|Hanging Leg Raise|Cable Crunch|Ab Wheel Rollout|Russian Twist|Decline Sit-Up',
    Forearms: "Wrist Curl|Reverse Wrist Curl|Farmer's Walk"
  },
  iso: {
    Abs: 'Plank|Side Plank|Hollow Body Hold|L-Sit|Pallof Press Hold',
    Forearms: "Dead Hang|Towel Hang|Plate Pinch|Farmer's Hold",
    Legs: 'Wall Sit|Static Lunge Hold|Glute Bridge Hold|Isometric Mid-Thigh Pull',
    Back: 'Chin-Up Hold|Superman Hold',
    Chest: 'Push-Up Hold'
  },
  cardio: { Cardio: 'Treadmill|Outdoor Run|Outdoor Walk|Stationary Bike|Cycling|Rowing Machine|Elliptical|Stair Climber|Jump Rope|Swimming' }
};
const PARTS = ['Chest', 'Back', 'Shoulders', 'Biceps', 'Triceps', 'Legs', 'Abs', 'Forearms', 'Cardio', 'Other'];
const TYPES = { lift: 'Lifting', iso: 'Isometric', cardio: 'Cardio' };
const seedList = () => Object.entries(SEED).flatMap(([type, parts]) => Object.entries(parts).flatMap(([part, s]) => s.split('|').map(name => ({ name, part, type }))));

/* ---------- helpers ---------- */
let S;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const fmtDate = s => new Date(s + 'T12:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
const fmtShort = s => new Date(s + 'T12:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const timeStr = t => new Date(t).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const fmtW = w => (w === '' || w == null) ? '–' : String(Math.round(w * 100) / 100);
const nf = v => Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10;
const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const unit = () => S.settings.unit;
const dUnit = () => unit() === 'kg' ? 'km' : 'mi';
const sortKey = s => s.date + '|' + String(s.start || 0).padStart(15, '0');
const ex = id => S.exercises.find(e => e.id === id) || { id, name: '(deleted exercise)', part: 'Other', type: 'lift' };
const tOf = id => ex(id).type || 'lift';
const getS = id => S.sessions.find(s => s.id === id);
const doneSets = e => e.sets.filter(x => x.done);
const tag = t => t && t !== 'lift' ? `<span class="tag ${t}">${t === 'iso' ? 'ISO' : 'CARDIO'}</span>` : '';
// Epley estimated one-rep max
function orm(w, r) { w = +w; r = +r; if (!w || !r) return 0; return r === 1 ? w : w * (1 + r / 30); }
const bestOrm = sets => sets.reduce((m, x) => Math.max(m, orm(x.w, x.r)), 0);
const holdOf = x => +x.held || +x.t || 0;
const bestHold = sets => sets.reduce((m, x) => Math.max(m, holdOf(x)), 0);
function fmtSet(e, x) {
  const t = tOf(e.exId);
  if (t === 'iso') return holdOf(x) + 's' + (+x.w ? '×' + fmtW(x.w) + (e.load === 'pct' ? '%' : '') : '');
  if (t === 'cardio') return [x.min ? nf(+x.min) + ' min' : '', x.dist ? nf(+x.dist) + ' ' + dUnit() : '', x.lvl ? 'L' + x.lvl : '', x.cal ? Math.round(x.cal) + ' kcal' : ''].filter(Boolean).join(' · ') || '—';
  return fmtW(x.w) + '×' + x.r;
}
function sessionsWith(exId) {
  const out = [];
  for (const s of S.sessions) for (const e of s.entries)
    if (e.exId === exId && e.sets.some(x => x.done)) out.push({ s, e });
  return out.sort((a, b) => sortKey(a.s) < sortKey(b.s) ? -1 : 1);
}
function prevFor(exId, s) {
  const k = s ? sortKey(s) : '9';
  const l = sessionsWith(exId).filter(x => (!s || x.s.id !== s.id) && sortKey(x.s) < k);
  return l[l.length - 1];
}
// best value of fn(doneSets) in sessions before s
function prBefore(exId, s, fn) {
  const k = sortKey(s); let best = null;
  for (const x of sessionsWith(exId)) {
    if (x.s.id === s.id || sortKey(x.s) >= k) continue;
    const v = fn(doneSets(x.e));
    if (!best || v > best.v) best = { v, date: x.s.date };
  }
  return best;
}
const FIELDS = { lift: ['w', 'r'], iso: ['t', 'w'], cardio: ['min', 'dist', 'lvl', 'cal'] };
function buildSets(exId, n) {
  const t = tOf(exId), p = prevFor(exId), ps = p ? doneSets(p.e) : [];
  n = n || ps.length || (t === 'cardio' ? 1 : 3);
  const out = [];
  for (let i = 0; i < n; i++) {
    const src = ps[i] || ps[ps.length - 1], st = { done: false };
    for (const f of FIELDS[t]) st[f] = src && src[f] != null ? src[f] : (f === 't' ? 30 : '');
    out.push(st);
  }
  return out;
}
function newEntry(exId, n) {
  const p = prevFor(exId), e = { exId, sets: buildSets(exId, n) };
  if (p && p.e.load) e.load = p.e.load;
  return e;
}
// MET-based estimate: lifting ~5, isometric ~3.8, cardio uses its own calories when entered
function estimateCal(s, end) {
  const bw = +S.settings.bw || (unit() === 'kg' ? 82 : 180);
  const kg = unit() === 'kg' ? bw : bw * 0.4536;
  end = end || s.end; if (!end || !s.start) return null;
  const T = Math.min(240, Math.max(0, (end - s.start) / 60000));
  let cal = 0, cmin = 0, lift = false, iso = false;
  for (const e of s.entries) {
    const t = tOf(e.exId), d = doneSets(e);
    if (!d.length) continue;
    if (t === 'cardio') for (const x of d) { const m = +x.min || 0; cmin += m; cal += +x.cal || 7 * kg * m / 60; }
    else if (t === 'iso') iso = true; else lift = true;
  }
  const met = lift ? 5 : iso ? 3.8 : 2.5;
  return Math.round(cal + met * kg * Math.max(0, T - cmin) / 60);
}
function toast(msg, gold) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = gold ? 'gold' : ''; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, gold ? 3500 : 2200);
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function pickFile(accept, cb) {
  const f = document.getElementById('file');
  f.accept = accept; f.value = '';
  f.onchange = () => { const file = f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => cb(r.result, file.name); r.readAsText(file); };
  f.click();
}

/* ---------- sound, vibration, screen wake ---------- */
let actx;
function beep(freq = 880, ms = 150, vol = 0.35) {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + ms / 1000);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + ms / 1000 + 0.02);
  } catch (e) { }
}
const doneBeep = () => { beep(1200, 350); setTimeout(() => beep(1200, 350), 450); setTimeout(() => beep(1500, 600), 900); };
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) { } };
let wake = null;
async function wakeOn() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch (e) { } }
function wakeOff() { try { wake && wake.release(); } catch (e) { } wake = null; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && hold) wakeOn(); });

/* ---------- navigation ---------- */
let stack = [{ v: 'lift' }], lastTop = null;
function go(v, p = {}) { closeMenu(); stack.push({ v, ...p }); history.pushState({ d: stack.length }, ''); render(); }
function back() { history.back(); }
window.addEventListener('popstate', () => { closeMenu(); if (stack.length > 1) { stack.pop(); render(); } });
function setTab(t) { closeMenu(); if (TYPES[t]) { S.settings.mode = t; save(); } stack = [{ v: t }]; render(); }
const IC = {
  lift: '<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
  iso: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
  cardio: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  history: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  routines: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  more: '<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',

const hdr = (title, backBtn, right = '') =>

/* ---------- rest timer + clocks ---------- */
let restEnd = 0, restBuzzed = false;
function startRest() { if (S.settings.rest > 0) { restEnd = Date.now() + S.settings.rest * 1000; restBuzzed = false; tick(); } }
function tick() {
  const el = document.getElementById('elapsed');
  const a = S && S.active && getS(S.active);
  if (el && a) { const m = Math.floor((Date.now() - a.start) / 60000); el.textContent = m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm'; }
  const r = document.getElementById('rest');
  if (hold) return;
  if (!restEnd) { r.hidden = true; return; }
  const left = Math.round((restEnd - Date.now()) / 1000);
  if (left <= 0 && !restBuzzed) { restBuzzed = true; vib([400, 150, 400]); beep(1000, 300); setTimeout(() => beep(1000, 300), 400); }
  if (left < -30) { restEnd = 0; r.hidden = true; return; }
  const t = Math.abs(left);
  r.hidden = false; r.className = left <= 0 ? 'over' : '';
  r.innerHTML = `<b>${left <= 0 ? 'Go! ' : 'Rest '}${mmss(t)}</b><button onclick="restEnd+=-15000;tick()">−15</button><button onclick="restEnd+=15000;tick()">+15</button><button onclick="restEnd=0;tick()">✕</button>`;
}
setInterval(tick, 1000);

/* ---------- isometric hold countdown ---------- */
let hold = null;
function holdLeft() { return hold ? (hold.end - Date.now()) / 1000 : 0; }
function holdTick() {
  if (!hold) return;
  const left = holdLeft(), sec = Math.ceil(left);
  if (hold.phase === 'ready') {
    if (sec !== hold.last && sec > 0 && sec <= 3) beep(660, 120);
    hold.last = sec;
    if (left <= 0) { hold.phase = 'hold'; hold.start = Date.now(); hold.end = hold.start + hold.t * 1000; hold.last = null; beep(1100, 300); vib(200); render(); return; }
  } else {
    if (sec !== hold.last && sec > 0 && sec <= 3) beep(880, 120);
    hold.last = sec;
    if (left <= 0) return finishHold(hold.t);
  }
  holdUI();
}
setInterval(holdTick, 200);
function holdUI() {
  const r = document.getElementById('rest');
  if (!hold) return;
  const left = Math.max(0, holdLeft()), ready = hold.phase === 'ready';
  const n = document.getElementById('hnum');
  if (n) {
    n.textContent = ready ? Math.ceil(left) : (left >= 60 ? mmss(Math.ceil(left)) : Math.ceil(left));
    document.getElementById('hlab').textContent = ready ? 'Get ready' : 'Hold!';
    document.getElementById('hbar').style.width = ready ? '0' : (100 * (1 - left / hold.t)) + '%';
    document.getElementById('holdp').className = 'holdp' + (ready ? ' ready' : '');
    r.hidden = true;
  } else {
    r.hidden = false; r.className = 'hold';
    r.innerHTML = `<b>${ready ? 'Ready ' : 'Hold '}${mmss(Math.ceil(left))}</b><button onclick="go('log',{sid:'${hold.sid}',i:${hold.i}})">Open</button><button onclick="A.holdStop()">Stop</button>`;
  }
}
function finishHold(held) {
  const h = hold; hold = null; wakeOff();
  const s = getS(h.sid), e = s && s.entries[h.i], st = e && e.sets[h.j];
  if (!st) return render();
  const pr = prBefore(e.exId, s, bestHold), bestToday = bestHold(e.sets.filter((x, k) => x.done && k !== h.j));
  st.held = held; st.done = held > 0; save();
  doneBeep(); vib([500, 150, 500]);

  else toast(`Held ${held}s`);

  render();
}

/* chart */
const RANGES = { '1M': 31, '6M': 183, '1Y': 366, 'All': 1e6 };
const sum = (d, f) => d.reduce((a, x) => a + (+f(x) || 0), 0), max = (d, f) => d.reduce((a, x) => Math.max(a, +f(x) || 0), 0);
const METRICS = {
  lift: { orm: ['Est. 1RM', d => bestOrm(d), 'max'], w: ['Heaviest', d => max(d, x => x.w), 'max'], vol: ['Volume', d => sum(d, x => x.w * x.r), 'sum'] },
  iso: { hold: ['Longest hold', d => bestHold(d), 'max'], load: ['Heaviest', d => max(d, x => x.w), 'max'], tut: ['Total secs', d => sum(d, holdOf), 'sum'] },
  cardio: { min: ['Minutes', d => sum(d, x => x.min), 'sum'], dist: ['Distance', d => sum(d, x => x.dist), 'sum'], cal: ['Calories', d => sum(d, x => x.cal), 'sum'] }
};
function series(exId, range, metric) {
  const m = METRICS[tOf(exId)][metric], cutoff = ymd(new Date(Date.now() - RANGES[range] * 864e5));
  const byDate = new Map();
  for (const { s, e } of sessionsWith(exId)) {
    if (s.date < cutoff) continue;
    const v = m[1](doneSets(e)), old = byDate.get(s.date);
    byDate.set(s.date, old == null ? v : m[2] === 'sum' ? old + v : Math.max(old, v));
  }
  return [...byDate].filter(([, v]) => v > 0).map(([date, v]) => ({ date, v, t: new Date(date + 'T12:00').getTime() }));
}
function chartSVG(pts) {
  const W = 340, H = 190, L = 40, R = 12, T = 12, B = 24;
  if (!pts.length) return `<div class="empty">No data in this time range.</div>`;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi === lo) { lo -= 5; hi += 5; }
  const padv = (hi - lo) * 0.08; lo = Math.max(0, lo - padv); hi += padv;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const X = t => t1 === t0 ? (L + W - R) / 2 : L + (t - t0) / (t1 - t0) * (W - L - R);
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = '';
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3, y = Y(v);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="lbl" x="${L - 6}" y="${y + 4}" text-anchor="end">${nf(v)}</text>`;
  }
  g += `<text class="lbl" x="${L}" y="${H - 6}">${fmtShort(pts[0].date)}</text>`;
  if (pts.length > 1) g += `<text class="lbl" x="${W - R}" y="${H - 6}" text-anchor="end">${fmtShort(pts[pts.length - 1].date)}</text>`;
  const best = pts.reduce((a, p) => p.v > a.v ? p : a, pts[0]);
  const line = pts.map(p => X(p.t).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ');
  const dots = pts.length <= 60 ? pts.map(p => `<circle class="dot" cx="${X(p.t)}" cy="${Y(p.v)}" r="3"/>`).join('') : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}<polyline class="ln" points="${line}"/>${dots}<circle class="best" cx="${X(best.t)}" cy="${Y(best.v)}" r="5"/></svg></div>`;
}

V.exercise = (top) => {
  const x = ex(top.id), t = x.type || 'lift', M = METRICS[t];
  top.range = top.range || '6M'; if (!M[top.metric]) top.metric = Object.keys(M)[0];
  const pts = series(x.id, top.range, top.metric);
  let h = hdr('History', true, `<button class="ic" onclick="go('exedit',{id:'${x.id}'})" aria-label="Edit">✎</button>`);
  h += `<h2 class="ex">${esc(x.name)}${tag(t)}</h2><div class="muted">${esc(x.part)}</div>`;
  h += `<div class="seg">${Object.keys(RANGES).map(r => `<button class="${top.range === r ? 'on' : ''}" onclick="A.view('range','${r}')">${r}</button>`).join('')}</div>`;
  h += `<div class="seg">${Object.entries(M).map(([k, l]) => `<button class="${top.metric === k ? 'on' : ''}" onclick="A.view('metric','${k}')">${l[0]}</button>`).join('')}</div>`;
  h += chartSVG(pts);
  if (pts.length) {
    const first = pts[0].v, last = pts[pts.length - 1].v, best = Math.max(...pts.map(p => p.v)), ch = last - first;
    h += `<div class="stats"><div><b>${nf(last)}</b><span>Latest</span></div><div><b class="pr">${nf(best)}</b><span>Best</span></div><div><b style="color:${ch >= 0 ? 'var(--ok)' : 'var(--warn)'}">${ch >= 0 ? '+' : ''}${nf(ch)}</b><span>Change</span></div></div>`;
  }
  const all = sessionsWith(x.id).reverse();
  h += `<div class="sec">All sessions (${all.length})</div>`;
  const lim = top.lim || 40;
  for (const { s, e } of all.slice(0, lim)) {
    const d = doneSets(e);
    const head = t === 'lift' ? ' · 1RM ' + Math.round(bestOrm(d)) : t === 'iso' ? ' · longest ' + bestHold(d) + 's' : '';
    h += `<div class="card" onclick="go('session',{id:'${s.id}'})"><div class="muted">${fmtDate(s.date)}${head}</div><div>${d.map(z => `<span class="hist-set">${fmtSet(e, z)}</span>`).join('')}</div></div>`;
  }
  if (all.length > lim) h += `<button class="btn wide" onclick="A.view('lim',${lim + 60})">Show more</button>`;
  return h + '</main>';
};

V.exedit = (top) => {

  h += `<label class="f"><span>Body part</span><select onchange="cur().f.part=this.value">${PARTS.map(p => `<option ${f.part === p ? 'selected' : ''}>${p}</option>`).join('')}</select></label>`;

V.picker = (top) => {

  if (top.type !== 'cardio') h += `<div class="chips">${['All', ...PARTS.filter(p => p !== 'Cardio')].map(p => `<button class="chip ${top.part === p ? 'on' : ''}" onclick="A.view('part','${p}')">${p}</button>`).join('')}</div>`;

function pickList(top) {
  const q = top.q.trim().toLowerCase();

V.history = (top) => {

V.library = (top) => {

  if (top.type !== 'cardio') h += `<div class="chips">${['All', ...PARTS].map(p => `<button class="chip ${top.part === p ? 'on' : ''}" onclick="A.view('part','${p}')">${p}</button>`).join('')}</div>`;

function libList(top) {

V.settings = () => {
  let h = hdr('Settings');
  h += `<label class="f"><span>Weight unit</span><select onchange="A.set('unit',this.value)"><option value="lb" ${unit() === 'lb' ? 'selected' : ''}>lb (distance in miles)</option><option value="kg" ${unit() === 'kg' ? 'selected' : ''}>kg (distance in km)</option></select></label>`;
  h += `<label class="f"><span>Your body weight (${unit()}), used to estimate calories</span><input type="number" inputmode="decimal" value="${S.settings.bw || ''}" placeholder="e.g. ${unit() === 'kg' ? 85 : 187}" onchange="A.set('bw',+this.value||'')"></label>`;
  h += `<label class="f"><span>Rest timer after each set (seconds, 0 = off)</span><input type="number" inputmode="numeric" value="${S.settings.rest}" onchange="A.set('rest',Math.max(0,+this.value||0))"></label>`;
  h += `<label class="f"><span>Isometric get-ready countdown (seconds)</span><input type="number" inputmode="numeric" value="${S.settings.ready}" onchange="A.set('ready',Math.max(0,+this.value||0))"></label>`;
  h += `<label class="f"><span>Beeps</span></label><div class="seg"><button class="${S.settings.sound ? 'on' : ''}" onclick="A.set('sound',true);beep()">On</button><button class="${S.settings.sound ? '' : 'on'}" onclick="A.set('sound',false)">Off</button></div>`;
  h += `<div class="sec">Import from JeFit</div><div class="card muted">Use JeFit's <b>Export data</b> to get a CSV file, copy it to this phone, then tap below. Importing again replaces the earlier JeFit import.</div>`;
  h += `<button class="btn wide pri" onclick="A.importJefit()">Import JeFit CSV</button>`;
  h += `<div class="sec">Backup</div><div class="card muted">Everything is stored only on this phone. Make a backup now and then and keep it somewhere safe (Google Drive, email it to yourself).</div>`;
  h += `<div class="btns"><button class="btn" onclick="A.exportBackup()">Save backup</button><button class="btn" onclick="A.importBackup()">Restore backup</button></div>`;
  const n = S.sessions.length, sets = S.sessions.reduce((a, s) => a + s.entries.reduce((b, e) => b + doneSets(e).length, 0), 0);
  h += `<div class="muted" style="margin:16px 0">${n} workouts · ${sets} sets · ${S.exercises.length} exercises</div>`;
  h += `<button class="btn wide danger" onclick="A.wipe()">Delete all data</button>`;

/* ---------- actions ---------- */
const cur = () => stack[stack.length - 1];
const A = {
  view(k, v) { cur()[k] = v; render(); },
  start(rid, wid, type) {
    if (S.active && getS(S.active)) { if (!confirm('You already have a workout in progress. Open it instead?')) return; return go('session', { id: S.active }); }
    const r = rid && S.routines.find(r => r.id === rid), w = r && r.workouts.find(w => w.id === wid);
    type = r ? (r.type || 'lift') : (type || 'lift');
    const s = { id: uid(), name: w ? w.name : TYPES[type] + ' workout', type, date: today(), start: Date.now(), entries: w ? w.items.map(it => newEntry(it.exId, it.sets)) : [] };
    S.sessions.push(s); S.active = s.id; S.settings.mode = type; save();
    stack = [{ v: type }]; go('session', { id: s.id });
  },
  renameS(id) { const s = getS(id), n = prompt('Workout name', s.name); if (n && n.trim()) { s.name = n.trim(); save(); render(); } },
  setDate(id, v) { if (v) { getS(id).date = v; save(); } },
  setCal(id, v) {
    const s = getS(id);
    if (v === 'est') { s.cal = estimateCal(s); s.calSrc = 'est'; }
    else if (v === '') { delete s.cal; delete s.calSrc; }
    else { s.cal = Math.round(+v); s.calSrc = 'manual'; }
    save(); render();
  },
  finish(id) {
    const s = getS(id);
    if (!s.entries.some(e => doneSets(e).length)) { if (confirm('No sets are checked off. Discard this workout?')) A.discard(id, true); return; }
    go('finish', { id, end: Date.now() });
  },
  finCal(v) { cur().cal = v; cur().manual = true; },
  finishSave() {
    const t = cur(), s = getS(t.id), est = estimateCal(s, t.end), v = parseFloat(t.cal);
    for (const e of s.entries) e.sets = doneSets(e);
    s.entries = s.entries.filter(e => e.sets.length);
    s.end = t.end; s.cal = isNaN(v) ? est : Math.round(v); s.calSrc = isNaN(v) || (Math.round(v) === est) ? 'est' : 'manual';
    S.active = null; restEnd = 0; if (hold) { hold = null; wakeOff(); } saveNow();
    toast(`Workout saved 💪 ${s.cal} kcal`); stack = [{ v: s.type || 'lift' }]; render();
  },
  discard(id, ok) {
    if (!ok && !confirm('Throw away this workout?')) return;
    const s = getS(id);
    S.sessions = S.sessions.filter(s => s.id !== id); S.active = null; restEnd = 0; if (hold) { hold = null; wakeOff(); } saveNow();
    stack = [{ v: (s && s.type) || 'lift' }]; render();
  },
  delS(id) { if (!confirm('Delete this workout from your history?')) return; S.sessions = S.sessions.filter(s => s.id !== id); save(); back(); },
  setv(sid, i, j, k, v) {
    const e = getS(sid).entries[i], st = e.sets[j];
    st[k] = v === '' ? '' : +v; if (k === 't') st.held = ''; save();
    const el = document.getElementById('orm' + j);
    if (el) { const o = orm(st.w, st.r); el.textContent = o ? Math.round(o) : '—'; }
  },
  tick(sid, i, j) {
    const s = getS(sid), e = s.entries[i], st = e.sets[j], t = tOf(e.exId);
    if (!st.done) {
      if (t === 'lift' && !st.r && st.r !== 0) return toast('Enter reps first');
      if (t === 'iso' && !+st.t) return toast('Enter hold seconds first');
      if (t === 'cardio' && !+st.min && !+st.dist && !+st.cal) return toast('Enter minutes, distance or calories');
    }
    st.done = !st.done; save();
    if (st.done) {
      if (s.id === S.active && t !== 'cardio') startRest();
      if (t === 'lift') {
        const pr = prBefore(e.exId, s, bestOrm), o = orm(st.w, st.r);
        const prevBestToday = bestOrm(e.sets.filter((x, k) => x.done && k !== j));
        if (pr && o > pr.v && o > prevBestToday) toast(`🏆 New PR! Est. 1RM ${Math.round(o)} ${unit()}`, true);
        else if (o) toast(`Est. 1RM ${Math.round(o)} ${unit()}`);
      }
    }
    render();
  },
  load(sid, i, v) { getS(sid).entries[i].load = v; save(); render(); },
  hold(sid, i, j) {
    const st = getS(sid).entries[i].sets[j];
    if (hold) return toast('A hold is already running');
    if (!+st.t) return toast('Enter hold seconds first');
    beep(1, 1, 0.001); // unlock audio on this tap
    restEnd = 0; wakeOn();
    const ready = +S.settings.ready || 0;
    hold = { sid, i, j, t: +st.t, phase: ready ? 'ready' : 'hold', end: Date.now() + (ready || +st.t) * 1000, start: Date.now(), last: null };
    if (!ready) beep(1100, 300);
    render();
  },
  holdStop() {
    if (!hold) return;
    if (hold.phase === 'ready') { hold = null; wakeOff(); return render(); }
    finishHold(Math.round((Date.now() - hold.start) / 1000));
  },
  addSet(sid, i) {
    const e = getS(sid).entries[i], l = e.sets[e.sets.length - 1], st = { done: false };
    for (const f of FIELDS[tOf(e.exId)]) st[f] = l ? l[f] : (f === 't' ? 30 : '');
    e.sets.push(st); save(); render();
  },
  rmSet(sid, i) { const e = getS(sid).entries[i]; if (e.sets.length) { e.sets.pop(); save(); render(); } },
  note(sid, i, v) { getS(sid).entries[i].note = v; save(); },
  jump(sid, i) { stack[stack.length - 1] = { v: 'log', sid, i }; render(); },
  rmEntry(sid, i) { if (!confirm('Remove this exercise from the workout?')) return; getS(sid).entries.splice(i, 1); save(); back(); },
  // picker
  pickQ(v) { cur().q = v; document.getElementById('plist').innerHTML = pickList(cur()); },
  pickToggle(id) { const t = cur(), k = t.sel.indexOf(id); k < 0 ? t.sel.push(id) : t.sel.splice(k, 1); render(); },
  pickDone() {
    const t = cur();
    if (t.mode === 'session') { const s = getS(t.sid); for (const id of t.sel) s.entries.push(newEntry(id)); }
    else { const w = S.routines.find(r => r.id === t.rid).workouts.find(w => w.id === t.wid); for (const id of t.sel) w.items.push({ exId: id, sets: tOf(id) === 'cardio' ? 1 : 3 }); }
    save(); back();
  },
  saveEx() {
    const t = cur(), f = t.f, name = f.name.trim();
    if (!name) return toast('Enter a name');
    if (t.id) { const x = S.exercises.find(e => e.id === t.id); Object.assign(x, { name, type: f.type, part: f.part }); }
    else {
      const e = { id: uid(), name, type: f.type, part: f.part, custom: true }; S.exercises.push(e);
      const below = stack[stack.length - 2];
      if (t.pick && below && below.v === 'picker') { below.sel.push(e.id); below.q = ''; below.type = f.type; below.uses = null; }
      if (below && below.v === 'library') below.uses = null;
    }
    save(); back();
  },
  delEx(id) { if (!confirm('Delete this exercise?')) return; S.exercises = S.exercises.filter(e => e.id !== id); save(); stack = [{ v: 'library' }]; render(); },
  libQ(v) { cur().q = v; document.getElementById('llist').innerHTML = libList(cur()); },
  // routines
  newRoutine(type) { const n = prompt(`New ${TYPES[type].toLowerCase()} routine name`); if (!n || !n.trim()) return; const r = { id: uid(), name: n.trim(), type, workouts: [] }; S.routines.push(r); save(); go('routine', { id: r.id }); },
  renameR(id) { const r = S.routines.find(r => r.id === id), n = prompt('Routine name', r.name); if (n && n.trim()) { r.name = n.trim(); save(); render(); } },
  routineType(id, t) { S.routines.find(r => r.id === id).type = t; save(); render(); },
  delRoutine(id) { if (!confirm('Delete this routine? Your logged workouts stay in History.')) return; S.routines = S.routines.filter(r => r.id !== id); save(); back(); },
  newWorkout(rid) { const n = prompt('Name this workout day (e.g. "Chest Day")'); if (!n || !n.trim()) return; const w = { id: uid(), name: n.trim(), items: [] }; S.routines.find(r => r.id === rid).workouts.push(w); save(); go('workout', { rid, wid: w.id }); },
  renameW(rid, wid) { const w = S.routines.find(r => r.id === rid).workouts.find(w => w.id === wid), n = prompt('Workout name', w.name); if (n && n.trim()) { w.name = n.trim(); save(); render(); } },
  delWorkout(rid, wid) { if (!confirm('Delete this workout day?')) return; const r = S.routines.find(r => r.id === rid); r.workouts = r.workouts.filter(w => w.id !== wid); save(); back(); },
  moveW(rid, k, d) { const a = S.routines.find(r => r.id === rid).workouts; const j = k + d; if (j < 0 || j >= a.length) return; [a[k], a[j]] = [a[j], a[k]]; save(); render(); },
  itemSets(rid, wid, k, d) { const it = S.routines.find(r => r.id === rid).workouts.find(w => w.id === wid).items[k]; it.sets = Math.max(1, Math.min(20, it.sets + d)); save(); render(); },
  moveItem(rid, wid, k, d) { const a = S.routines.find(r => r.id === rid).workouts.find(w => w.id === wid).items; const j = k + d; if (j < 0 || j >= a.length) return; [a[k], a[j]] = [a[j], a[k]]; save(); render(); },
  rmItem(rid, wid, k) { S.routines.find(r => r.id === rid).workouts.find(w => w.id === wid).items.splice(k, 1); save(); render(); },
  // settings
  set(k, v) { S.settings[k] = v; save(); render(); },
  exportBackup() { download(`liftlog-backup-${today()}.json`, JSON.stringify(S), 'application/json'); },
  importBackup() {
    pickFile('.json,application/json', text => {
      let d; try { d = JSON.parse(text); } catch { return alert('That file is not a LiftLog backup.'); }
      if (!d || !Array.isArray(d.sessions) || !Array.isArray(d.exercises)) return alert('That file is not a LiftLog backup.');
      if (!confirm(`Replace everything on this phone with this backup (${d.sessions.length} workouts)?`)) return;
      S = migrate(d); saveNow(); stack = [{ v: 'lift' }]; render(); toast('Backup restored');
    });
  },
  importJefit() { pickFile('.csv,text/csv,text/plain,*/*', (text, name) => runJefitImport(text, name)); },
  wipe() {
    if (!confirm('Delete ALL workouts, routines and exercises on this phone?')) return;
    if (prompt('Type DELETE to confirm') !== 'DELETE') return;
    S = fresh(); saveNow(); stack = [{ v: 'lift' }]; render();
  }
};

/* ---------- JeFit / CSV import ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
function normDate(v) {
  v = String(v || '').trim(); if (!v) return null;
  if (/^\d{10}$/.test(v)) return ymd(new Date(+v * 1000));
  if (/^\d{13}$/.test(v)) return ymd(new Date(+v));
  const m = v.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  if (m) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
  const d = new Date(v); return isNaN(d) ? null : ymd(d);
}
// JeFit exports one CSV with "### SECTION ###" blocks. Inside a block a header row can repeat
// (the ROUTINES block has separate headers for routines, days and day exercises).
function csvRecords(text) {
  const out = {}; let sec = '', hdr = null;
  for (const r of parseCSV(text)) {
    if (r.every(c => !c.trim())) continue;
    const first = (r[0] || '').trim();
    if (first.startsWith('###')) { const n = first.replace(/#/g, '').trim(); if (n) sec = n; hdr = null; continue; }
    if (r.every(c => !c.trim() || /^[A-Za-z_][\w() ]*$/.test(c.trim())) && (!hdr || r.some(c => /^(row_?id|userid|_id)$/i.test(c.trim())))) {
      hdr = r.map(c => c.trim().toLowerCase().replace(/\s+/g, '_')); continue;
    }
    if (!hdr) continue;
    const o = {}; hdr.forEach((k, i) => o[k] = r[i] ?? '');
    (out[sec] = out[sec] || []).push(o);
  }
  return out;
}
// JeFit body part codes
const JF_PART = { 0: 'Abs', 1: 'Back', 2: 'Biceps', 3: 'Chest', 4: 'Forearms', 5: 'Legs', 6: 'Shoulders', 7: 'Triceps', 8: 'Legs', 9: 'Legs', 10: 'Cardio' };
function jefitParse(text) {
  const R = csvRecords(text);
  const items = [], routines = [], partOf = {}, meta = {};
  const logs = R['EXERCISE LOGS'];
  const rt = R['ROUTINES'] || [];
  let bw = null;
  for (const o of [...rt.filter(o => o.exercisename), ...(R['CUSTOM EXERCISES'] || [])]) {
    const n = (o.exercisename || o.name || '').trim().toLowerCase();
    if (n && JF_PART[o.bodypart] && !partOf[n]) partOf[n] = JF_PART[o.bodypart];
  }
  if (logs) {
    // workout name: log -> session -> routine day; session start/end times too
    const dayName = {}, sessRow = {}, cardioOf = {}, eidName = {};
    for (const o of rt) if (o.package && o.name) dayName[o._id] = o.name.trim();
    for (const o of R['WORKOUT SESSIONS'] || []) sessRow[o._id] = o;
    for (const o of R['CARDIO EXERCISE LOGS'] || []) cardioOf[o.el_id] = o;
    for (const o of logs) if (o.ename) eidName[(o.belongsys || '1') + ':' + o.eid] = o.ename.trim();
    for (const o of R['CUSTOM EXERCISES'] || []) if (o.name && !eidName['0:' + o._id]) eidName['0:' + o._id] = o.name.trim();
    const seen = new Set();
    // older cardio lived in its own section
    for (const o of R['CARDIO LOGS'] || []) {
      const date = normDate(o.mydate), sec = +o.duration || 0;
      if (!date || sec <= 0) continue;
      const name = eidName[(o.belongsys || '1') + ':' + o.eid] || (o.eid === '310' ? 'Elliptical Training' : 'Cardio');
      seen.add(date + '|' + name.toLowerCase());
      items.push({ kind: 'cardio', date, name, key: date + '|', min: Math.round(sec / 6) / 10, cal: Math.round(+o.calorie) || '', dist: +o.distance || '' });
    }
    for (const o of logs) {
      const date = normDate(o.mydate), name = (o.ename || '').trim();
      if (!date || !name) continue;
      const sess = o.belongsession && o.belongsession !== '0' ? o.belongsession : '';
      const sr = sess && sessRow[sess], key = date + '|' + sess;
      if (sr && !meta[key]) meta[key] = { start: +sr.starttime * 1000 || 0, end: +sr.endtime * 1000 || 0, name: dayName[sr.day_id] || '' };
      const c = cardioOf[o._id];
      if (c) {
        // cardio_logs looks like "0x3600": the number after the x is seconds
        const sec = +(String(c.cardio_logs).split('x')[1] || 0);
        if (sec > 0) items.push({ kind: 'cardio', date, name, key, min: Math.round(sec / 6) / 10, cal: Math.round(+c.calorie_logs) || '', dist: +c.distance_logs || '' });
        continue;
      }
      const pairs = [...String(o.logs || '').matchAll(/(\d+(?:\.\d+)?)\s*[xX×]\s*(\d+)/g)];
      if ((partOf[name.toLowerCase()] || guessPart(name)) === 'Cardio') {
        // older cardio was also logged here as "0x<seconds>"; the CARDIO LOGS copy (with calories) wins
        const sec = Math.max(0, ...pairs.map(m => +m[2]));
        if (sec >= 60 && !seen.has(date + '|' + name.toLowerCase())) items.push({ kind: 'cardio', date, name, key, min: Math.round(sec / 6) / 10, cal: '', dist: '' });
        continue;
      }
      for (const m of pairs)
        if (+m[2] > 0) items.push({ kind: 'lift', date, name, part: partOf[name.toLowerCase()], w: +m[1], r: +m[2], key });
    }
    const routs = rt.filter(o => o.difficulty !== undefined && !o.package && !o.exercisename && o.name);
    for (const r of routs) {
      const days = rt.filter(o => o.package === r._id && o.name).sort((a, b) => (+a.dayindex || +a.day || 0) - (+b.dayindex || +b.day || 0));
      routines.push({
        name: r.name.trim(),
        days: days.map(d => ({
          name: d.name.trim(),
          items: rt.filter(o => o.belongplan === d._id && o.exercisename).sort((a, b) => +a.mysort - +b.mysort)
            .map(o => ({ name: o.exercisename.trim(), part: JF_PART[o.bodypart], sets: Math.max(1, +o.setcount || 3) }))
        }))
      });
    }
    const pr = (R['PROFILE'] || []).filter(o => +o.weight > 0).sort((a, b) => (a.mydate || '').localeCompare(b.mydate || ''));
    if (pr.length) bw = +pr[pr.length - 1].weight;
  } else {
    // fallback: plain CSV with one row per set (date, exercise, weight, reps)
    for (const o of Object.values(R).flat()) {
      const date = normDate(o.date || o.mydate || o.workout_date), name = (o.exercise_name || o.exercise || o.ename || '').trim();
      const r = parseInt(o.reps), w = parseFloat(o.weight ?? o.weight_lbs ?? o.weight_kg), wk = o.workout_name || '';
      if (date && name && r > 0) { const key = date + '|' + wk; meta[key] = meta[key] || { name: wk }; items.push({ kind: 'lift', date, name, w: isNaN(w) ? 0 : w, r, key }); }
    }
  }
  return { secs: Object.keys(R), items, routines, meta, bw };
}
function runJefitImport(text, fname) {
  let res; try { res = jefitParse(text); } catch (e) { return alert('Could not read that file: ' + e.message); }
  const { secs, items, routines, meta, bw } = res;
  if (!items.length) return alert('No workout logs found in ' + fname + '.\nSections seen: ' + secs.join(', ') + '\n\nSend this file to Claude so the importer can be adjusted.');
  const dates = [...new Set(items.map(s => s.date))].sort();
  const names = new Set(items.map(s => s.name.toLowerCase()));
  const nLift = items.filter(x => x.kind === 'lift').length, nCardio = items.filter(x => x.kind === 'cardio').length;
  const had = S.sessions.filter(s => s.src === 'jefit').length;
  if (!confirm(`Found ${dates.length} workout days, ${names.size} exercises, ${nLift} sets and ${nCardio} cardio sessions\nfrom ${fmtDate(dates[0])} to ${fmtDate(dates[dates.length - 1])}` +
    (routines.length ? `, plus ${routines.length} routines` : '') + '.' +
    (had ? `\n\nThis replaces your previous JeFit import (and its routines).` : '') + '\n\nImport now?')) return;
  S.sessions = S.sessions.filter(s => s.src !== 'jefit');
  S.routines = S.routines.filter(r => r.src !== 'jefit');
  const byName = new Map(S.exercises.map(e => [e.name.toLowerCase(), e]));
  let newEx = 0;
  const exFor = (name, part, type) => {
    let e = byName.get(name.toLowerCase());
    if (!e) {
      const p = part || guessPart(name);
      e = { id: uid(), name, part: type === 'cardio' ? 'Cardio' : p, type: type || (p === 'Cardio' ? 'cardio' : 'lift'), imported: true };
      S.exercises.push(e); byName.set(name.toLowerCase(), e); newEx++;
    }
    return e;
  };
  const byKey = new Map(), byDate = new Map();
  const sessFor = (key, date) => {
    let s = byKey.get(key);
    if (!s) {
      const m = meta[key] || {};
      s = { id: uid(), name: m.name || 'Workout', type: 'lift', date, start: m.start || new Date(date + 'T12:00').getTime() + byKey.size, end: m.end || undefined, entries: [], src: 'jefit' };
      if (s.end && s.end <= s.start) delete s.end;
      byKey.set(key, s); if (!byDate.has(date)) byDate.set(date, s);
    }
    return s;
  };
  for (const it of items.filter(x => x.kind === 'lift')) {
    const s = sessFor(it.key, it.date), e = exFor(it.name, it.part);
    let en = s.entries.find(x => x.exId === e.id);
    if (!en) { en = { exId: e.id, sets: [] }; s.entries.push(en); }
    en.sets.push({ w: it.w, r: it.r, done: true });
  }
  for (const it of items.filter(x => x.kind === 'cardio')) {
    // old cardio logs have no session: put them in that day's workout if there is one
    const s = byKey.get(it.key) || byDate.get(it.date) || sessFor(it.key, it.date), e = exFor(it.name, 'Cardio', 'cardio');
    if (e.type !== 'cardio') { e.type = 'cardio'; e.part = 'Cardio'; }
    let en = s.entries.find(x => x.exId === e.id);
    if (!en) { en = { exId: e.id, sets: [] }; s.entries.push(en); }
    en.sets.push({ min: it.min, dist: it.dist, lvl: '', cal: it.cal, done: true });
  }
  for (const s of byKey.values()) {
    if (s.entries.every(e => tOf(e.exId) === 'cardio')) { s.type = 'cardio'; if (s.name === 'Workout') s.name = 'Cardio'; }
  }
  S.sessions.push(...byKey.values());
  for (const r of routines) {
    const workouts = r.days.map(d => ({ id: uid(), name: d.name, items: d.items.map(it => ({ exId: exFor(it.name, it.part).id, sets: it.sets })) }));
    const all = workouts.flatMap(w => w.items), type = all.length && all.every(i => tOf(i.exId) === 'cardio') ? 'cardio' : 'lift';
    S.routines.push({ id: uid(), name: r.name, type, src: 'jefit', workouts });
  }
  if (bw && !S.settings.bw) S.settings.bw = bw;
  saveNow(); render();
  alert(`Imported ${byKey.size} workouts and ${routines.length} routines (${newEx} exercises added to your library).` + (bw ? `\nBody weight from JeFit: ${S.settings.bw} ${unit()}.` : ''));
}
function guessPart(n) {
  n = n.toLowerCase();
  const rules = [['Cardio', /elliptical|treadmill|bike|cycl|running|\brun\b|rowing machine|stair|jump rope|swim|walk/], ['Chest', /bench|chest|fly|flye|pec|push-?up|dip/], ['Back', /row|pull|lat|deadlift|chin/], ['Shoulders', /shoulder|overhead|military|lateral|delt|shrug|arnold|face pull/],
    ['Biceps', /curl/], ['Triceps', /tricep|skull|pushdown|extension/], ['Legs', /squat|leg|lunge|calf|hip|glute|hamstring/], ['Abs', /crunch|ab |abs|plank|sit-?up|oblique/]];
  for (const [p, re] of rules) if (re.test(n)) return p;
  return 'Other';
}

/* ---------- boot ---------- */
function fresh() {
  return migrate({ v: 2, settings: {}, exercises: seedList().map(e => ({ id: uid(), ...e })), routines: [], sessions: [], active: null });
}
// bring older saved data up to the current shape
function migrate(d) {
  d.settings = Object.assign({ unit: 'lb', rest: 90, bw: '', sound: true, ready: 5, mode: 'lift' }, d.settings);
  const isoNames = new Set(Object.values(SEED.iso).flatMap(s => s.split('|')).map(n => n.toLowerCase()));
  for (const e of d.exercises) if (!e.type) e.type = e.part === 'Cardio' ? 'cardio' : isoNames.has(e.name.toLowerCase()) ? 'iso' : 'lift';
  const have = new Set(d.exercises.map(e => e.name.toLowerCase()));
  for (const e of seedList()) if (e.type !== 'lift' && !have.has(e.name.toLowerCase())) d.exercises.push({ id: uid(), ...e });
  const typeOf = new Map(d.exercises.map(e => [e.id, e.type]));
  for (const r of d.routines) r.type = r.type || 'lift';
  for (const s of d.sessions) {
    s.type = s.type || 'lift';
    for (const e of s.entries) {
      const t = typeOf.get(e.exId);
      // the first importer stored JeFit cardio seconds as "reps"
      if (t === 'cardio') e.sets = e.sets.filter(x => x.min != null || +x.r >= 60).map(x => x.min != null ? x : { min: Math.round(x.r / 6) / 10, dist: '', lvl: '', cal: '', done: x.done });
      if (t === 'iso') for (const x of e.sets) if (x.t == null && x.r != null) { x.t = +x.r; x.held = +x.r; }
    }
  }
  d.v = 2;
  return d;
}
(async () => {
  try { S = await loadState(); } catch (e) { console.error(e); }
  S = S ? migrate(S) : fresh(); saveNow();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  stack = [{ v: S.settings.mode || 'lift' }];
  history.replaceState({ d: 1 }, '');
  render();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
})();
</script>
